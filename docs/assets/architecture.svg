<svg viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture diagram: AI/RL environment on top, data engineering warehouse pipeline in the middle, automated orchestration (Prefect + GitHub Actions) driving both at the bottom">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="850" rx="14" fill="#0d1117"/>

  <!-- Zone backgrounds -->
  <rect x="16" y="16" width="968" height="298" rx="10" fill="#0f1b2d" stroke="#1f6feb" stroke-opacity="0.35"/>
  <rect x="16" y="330" width="968" height="314" rx="10" fill="#1a1024" stroke="#a371f7" stroke-opacity="0.35"/>
  <rect x="16" y="660" width="968" height="174" rx="10" fill="#0f2418" stroke="#3fb950" stroke-opacity="0.35"/>

  <text x="38" y="46" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#58a6ff" letter-spacing="1">AI / RL ENVIRONMENT</text>
  <text x="38" y="360" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#a371f7" letter-spacing="1">DATA ENGINEERING</text>
  <text x="38" y="690" font-family="-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#3fb950" letter-spacing="1">AUTOMATED ORCHESTRATION</text>

  <!-- ===== ZONE 1: AI / RL ===== -->

  <!-- inference.py (frozen), dashed, feeds run_episodes.py -->
  <rect x="215" y="66" width="220" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="325" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="700" fill="#c9d1d9">inference.py (frozen)</text>
  <text x="325" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">graders · prompts · TASKS</text>
  <line x1="325" y1="112" x2="325" y2="138" stroke="#484f58" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="335" y="128" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">imports</text>

  <!-- Box A: LLM Agent -->
  <rect x="40" y="140" width="170" height="86" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="125" y="172" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700" fill="#c9d1d9">LLM Agent</text>
  <text x="125" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">any OpenAI-compatible</text>
  <text x="125" y="207" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">provider</text>

  <!-- Box B: run_episodes.py -->
  <rect x="240" y="140" width="180" height="86" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="330" y="168" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700" fill="#c9d1d9">run_episodes.py</text>
  <text x="330" y="187" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">WebSocket client</text>
  <text x="330" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">retry + backoff</text>

  <!-- Box C: EmailTriageEnvironment -->
  <rect x="460" y="130" width="250" height="106" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="585" y="158" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="700" fill="#c9d1d9">EmailTriageEnvironment</text>
  <text x="585" y="176" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">FastAPI · OpenEnv server</text>
  <text x="585" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">phishing · escalation</text>
  <text x="585" y="208" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">shaped reward function</text>

  <!-- Arrows A -> B -> C -->
  <line x1="210" y1="180" x2="238" y2="180" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="224" y="172" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="9.5" fill="#8b949e">action</text>

  <line x1="420" y1="168" x2="458" y2="160" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <line x1="458" y1="196" x2="420" y2="196" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="439" y="150" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="9.5" fill="#8b949e">reset()/step()</text>
  <text x="439" y="212" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="9.5" fill="#8b949e">reward + obs</text>

  <!-- Six graded tasks pill (two lines, verified to fit) -->
  <rect x="460" y="246" width="480" height="56" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.3"/>
  <text x="700" y="267" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#c9d1d9">spam-detect · priority · full-triage</text>
  <text x="700" y="285" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#c9d1d9">critical-escalation · action-orchestrator · threat-assessment</text>
  <line x1="585" y1="236" x2="640" y2="246" stroke="#484f58" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== BRIDGE: telemetry hooks ===== -->
  <line x1="330" y1="226" x2="400" y2="376" stroke="#a371f7" stroke-width="1.6" stroke-dasharray="2,3" marker-end="url(#arrow-purple)"/>
  <text x="345" y="300" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#a371f7">log_client_step()</text>

  <line x1="585" y1="236" x2="500" y2="376" stroke="#a371f7" stroke-width="1.6" stroke-dasharray="2,3" marker-end="url(#arrow-purple)"/>
  <text x="512" y="306" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#a371f7">log_env_step()</text>

  <!-- ===== ZONE 2: DATA ENGINEERING ===== -->

  <!-- Box F: event_sink.py -->
  <rect x="330" y="378" width="240" height="66" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.6"/>
  <text x="450" y="404" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">telemetry/event_sink.py</text>
  <text x="450" y="422" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">JSONL · fail-open · append-only</text>

  <!-- Box G: compact_to_parquet.py -->
  <rect x="60" y="480" width="210" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="165" y="507" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">compact_to_parquet.py</text>
  <text x="165" y="525" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">idempotent · pinned schema</text>

  <!-- Box H: data lake -->
  <rect x="300" y="480" width="210" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="405" y="507" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">data/lake/*.parquet</text>
  <text x="405" y="525" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">partitioned by dt=</text>

  <!-- Box I: dbt -->
  <rect x="540" y="470" width="230" height="90" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.6"/>
  <text x="655" y="497" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">dbt-duckdb</text>
  <text x="655" y="515" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">staging -&gt; intermediate</text>
  <text x="655" y="531" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">-&gt; marts</text>

  <!-- Box J: warehouse.duckdb -->
  <rect x="800" y="480" width="160" height="70" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.6"/>
  <text x="880" y="507" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">warehouse</text>
  <text x="880" y="525" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#8b949e">.duckdb — query in SQL</text>

  <!-- Arrows F -> G -> H -> I -> J -->
  <line x1="400" y1="444" x2="220" y2="478" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="515" x2="298" y2="515" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="515" x2="538" y2="515" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="515" x2="798" y2="515" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Marts pill (two lines, verified to fit) -->
  <rect x="330" y="580" width="480" height="56" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.3"/>
  <text x="570" y="601" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#c9d1d9">fct_reward_components · fct_confusion_matrix</text>
  <text x="570" y="619" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#c9d1d9">agg_model_leaderboard · agg_episode_summary</text>
  <line x1="655" y1="560" x2="600" y2="580" stroke="#484f58" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== ZONE 3: AUTOMATED ORCHESTRATION ===== -->

  <!-- Vertical connectors from pipeline_flow.py up into zones 1 & 2 (drawn
       first so they sit behind the zone-3 boxes) -->
  <line x1="290" y1="712" x2="290" y2="316" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="2,3" marker-end="url(#arrow-green)"/>
  <line x1="450" y1="712" x2="450" y2="646" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="2,3" marker-end="url(#arrow-green)"/>
  <text x="278" y="706" text-anchor="end" font-family="-apple-system,Segoe UI,sans-serif" font-size="9.5" fill="#3fb950">→ run_episodes.py</text>
  <text x="458" y="706" font-family="-apple-system,Segoe UI,sans-serif" font-size="9.5" fill="#3fb950">→ dbt build</text>

  <!-- warehouse.duckdb (zone 2) -> Streamlit dashboard (zone 3): direct read, bypasses the flow -->
  <line x1="880" y1="552" x2="880" y2="710" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="2,3" marker-end="url(#arrow-purple)"/>
  <text x="890" y="600" font-family="-apple-system,Segoe UI,sans-serif" font-size="9.5" fill="#a371f7">reads .duckdb</text>
  <text x="890" y="613" font-family="-apple-system,Segoe UI,sans-serif" font-size="9.5" fill="#a371f7">directly</text>

  <!-- Box K: GitHub Actions cron trigger -->
  <rect x="40" y="712" width="170" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="125" y="738" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="700" fill="#c9d1d9">GitHub Actions</text>
  <text x="125" y="756" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">eval-pipeline.yml</text>
  <text x="125" y="772" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">cron: weekly</text>
  <text x="125" y="788" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">free · public repos</text>

  <!-- Box L: orchestration/pipeline_flow.py -->
  <rect x="250" y="712" width="250" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="375" y="738" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="700" fill="#c9d1d9">pipeline_flow.py</text>
  <text x="375" y="756" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">Prefect flow · no server needed</text>
  <text x="375" y="772" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">eval -&gt; compact -&gt; dbt build</text>
  <text x="375" y="788" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">-&gt; leaderboard query</text>

  <!-- Box M: README + badge -->
  <rect x="530" y="712" width="190" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="625" y="738" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="700" fill="#c9d1d9">README.md</text>
  <text x="625" y="756" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">Baseline Scores table</text>
  <text x="625" y="772" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">+ last-evaluated badge</text>
  <text x="625" y="788" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">committed back by CI</text>

  <!-- Box N: Streamlit dashboard -->
  <rect x="790" y="712" width="170" height="90" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.6"/>
  <text x="875" y="738" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12.5" font-weight="700" fill="#c9d1d9">Streamlit dashboard</text>
  <text x="875" y="756" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">reads warehouse.duckdb</text>
  <text x="875" y="772" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">leaderboard · confusion matrix</text>
  <text x="875" y="788" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">reward diagnostics · episodes</text>

  <!-- Arrows K -> L -> M -->
  <line x1="210" y1="757" x2="248" y2="757" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="229" y="748" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="9" fill="#8b949e">triggers</text>

  <line x1="500" y1="757" x2="528" y2="757" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="514" y="748" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="9" fill="#8b949e">writes</text>
</svg>