<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal demo: running the email triage RL evaluation and data warehouse pipeline manually, then the same thing automatically via the scheduled orchestration pipeline">
  <defs>
    <clipPath id="winclip"><rect x="10" y="10" width="880" height="450" rx="10"/></clipPath>
  </defs>
  <rect x="10" y="10" width="880" height="450" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <g clip-path="url(#winclip)">
    <rect x="10" y="10" width="880" height="34" fill="#161b22"/>
    <circle cx="34" cy="27" r="6" fill="#ff5f56"/>
    <circle cx="54" cy="27" r="6" fill="#ffbd2e"/>
    <circle cx="74" cy="27" r="6" fill="#27c93f"/>
    <text x="450" y="32" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8b949e">bash — email-triage-rl — warehouse</text>
    <text x="34" y="78" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#58a6ff" opacity="1">$ python run_episodes.py --episodes 4
      <animate attributeName="opacity" keyTimes="0.0000;0.0212;0.0242;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="104" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#c9d1d9" opacity="1">[spam-detection ep1 step6] priority=high,category=support,route=support_team
      <animate attributeName="opacity" keyTimes="0.0000;0.0727;0.0758;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="130" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#3fb950" opacity="1">=== spam-detection episode 1: 10 steps, avg_task_reward=0.990 ===
      <animate attributeName="opacity" keyTimes="0.0000;0.1242;0.1273;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="182" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#58a6ff" opacity="1">$ python telemetry/compact_to_parquet.py
      <animate attributeName="opacity" keyTimes="0.0000;0.1758;0.1788;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="208" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#c9d1d9" opacity="1">[client_steps] compacted 10 rows -&gt; data/lake/client_steps
      <animate attributeName="opacity" keyTimes="0.0000;0.2273;0.2303;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="260" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#58a6ff" opacity="1">$ dbt run --profiles-dir .
      <animate attributeName="opacity" keyTimes="0.0000;0.2788;0.2818;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="286" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#c9d1d9" opacity="1">Found 7 models, 486 macros  |  Completed successfully
      <animate attributeName="opacity" keyTimes="0.0000;0.3303;0.3333;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="312" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#3fb950" font-weight="700" opacity="1">Done. PASS=7 WARN=0 ERROR=0 SKIP=0 NO-OP=0 REUSED=0 TOTAL=7
      <animate attributeName="opacity" keyTimes="0.0000;0.3818;0.3848;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>

    <text x="34" y="364" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#6e7681" font-style="italic" opacity="1"># ...or run the whole thing as one scheduled job:
      <animate attributeName="opacity" keyTimes="0.0000;0.4364;0.4394;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="390" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#58a6ff" opacity="1">$ python orchestration/pipeline_flow.py
      <animate attributeName="opacity" keyTimes="0.0000;0.4879;0.4909;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="416" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#c9d1d9" opacity="1">eval -&gt; compact -&gt; dbt build (PASS=22 ERROR=0) -&gt; leaderboard
      <animate attributeName="opacity" keyTimes="0.0000;0.5394;0.5424;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="442" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#3fb950" font-weight="700" opacity="1">README.md + badge updated. Next run: GitHub Actions, weekly.
      <animate attributeName="opacity" keyTimes="0.0000;0.5909;0.5939;0.8939;0.9242;1.0000" values="0;0;1;1;0;0" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <rect x="552" y="431" width="8" height="14" fill="#3fb950">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;1;1;0" keyTimes="0;0.5909;0.61;0.65;0.69;0.73;0.8939;0.9;0.95;1" dur="16.5s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>