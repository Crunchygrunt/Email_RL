name: Scheduled Model Evaluation

on:
  schedule:
    # Sundays 06:00 UTC. Weekly, not daily -- a multi-model run against
    # Groq's free tier already takes a while (fixed 1s inter-request pacing
    # in run_episodes.py, plus retry/backoff on empty responses), and
    # weekly keeps this comfortably inside both GitHub Actions' free
    # public-repo minutes and Groq's daily token quota. Tighten the cron
    # once you've watched a few real runs and know the actual wall-clock cost.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}  # adds a manual "Run workflow" button for on-demand runs

permissions:
  contents: write  # needed so the workflow can commit the regenerated README + badge

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Confirmed from the real files this session:
      #   - server/requirements.txt: openenv-core, fastapi, uvicorn, httpx, python-dotenv
      #   - run_episodes.py additionally imports `openai` and `websockets`,
      #     neither of which is in server/requirements.txt
      #   - compact_to_parquet.py needs `pyarrow`; dbt needs `dbt-duckdb`
      #     (brings its own `duckdb`); pipeline_flow.py itself needs
      #     duckdb/pyyaml/prefect (requirements-orchestration.txt)
      # If a requirements-warehouse.txt / root requirements.txt already
      # exists in the real repo with some of these, this is harmlessly
      # redundant -- consolidate once confirmed rather than remove blind.
      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          pip install -r requirements-orchestration.txt
          pip install openai websockets pyarrow dbt-duckdb

      # inference.py (frozen) reads its LLM API key via the literal,
      # space-containing env var name `os.getenv("Grok API")` -- confirmed
      # directly from source. pipeline_flow.py translates a normally-named
      # GROQ_API_KEY secret into that exact key before spawning each
      # run_episodes.py subprocess, so nothing unusual needs to happen
      # here beyond setting the secret.
      #
      # API_BASE_URL and EMAIL_RL_SERVER_URL are NOT set here on purpose:
      # inference.py's own defaults already are
      # https://api.groq.com/openai/v1 and http://localhost:8000, which is
      # exactly right for this workflow.
      - name: Start the environment server
        run: |
          python -m uvicorn server.app:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/schema > /dev/null; then
              echo "Server is up."
              break
            fi
            echo "Waiting for server... ($i/15)"
            sleep 2
          done

      - name: Run orchestrated evaluation pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python orchestration/pipeline_flow.py

      - name: Commit updated README and badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated evaluation run [skip ci]"
          file_pattern: "README.md docs/assets/last_evaluated_badge.json warehouse/warehouse.duckdb"

          